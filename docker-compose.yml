services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finsql-postgres
    environment:
      POSTGRES_USER: finsql
      POSTGRES_PASSWORD: finsqlpass
      POSTGRES_DB: finsqldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsql -d finsqldb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
